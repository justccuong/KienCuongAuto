name: CI/CD - Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🔨 Build Frontend (Vite)
        run: |
          cd frontend
          npm run build

      - name: 📂 Transfer Frontend dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/dist/*"
          target: "/root/KienCuongAuto/frontend/dist"
          strip_components: 2
          rm: true

      - name: 🚀 Deploy Backend & Reload PM2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "📥 Navigating to project directory..."
            cd /root/KienCuongAuto

            echo "🔄 Pulling latest source code..."
            git pull origin main

            echo "📦 Installing backend production dependencies..."
            cd /root/KienCuongAuto/backend
            npm install --omit=dev

            echo "⚡ Reloading PM2 process (zero-downtime)..."
            pm2 reload kca-backend --update-env || pm2 restart kca-backend

            echo "✅ Deployment finished successfully!"
