name: CI/CD - Build & Deploy to Dokploy

on:
  push:
    branches:
      - main  # Trigger workflow when pushing to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository name to lowercase to comply with docker tagging rules
      - name: Downcase Repo Owner and Name
        id: repo_names
        run: |
          echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
          echo "name=${NAME,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: '${{ github.repository_owner }}'
          NAME: '${{ github.event.repository.name }}'

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_names.outputs.owner }}/${{ steps.repo_names.outputs.name }}:latest
            ghcr.io/${{ steps.repo_names.outputs.owner }}/${{ steps.repo_names.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Deployment Webhook
        run: |
          if [ -z "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            echo "⚠️ DOKPLOY_WEBHOOK_URL secret is not set. Skipping deploy trigger."
          else
            echo "🚀 Triggering Dokploy deployment..."
            curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
          fi
